version: '3.9'

services:
  guard-api:
    build:
      context: .
      target: production
    ports:
      - '8080:8080'
      - '9090:9090'
    environment:
      - GUARD_ENVIRONMENT=production
      - GUARD_LOG_LEVEL=info
      - GUARD_FAIL_MODE=closed
      - GUARD_METRICS_PORT=9090
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./policies:/app/policies:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8080/v1/health")']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.50.0
    ports:
      - '9091:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - guard-api

  grafana:
    image: grafana/grafana:10.3.0
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
