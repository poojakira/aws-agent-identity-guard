name: Security Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'iam/**'
      - 'terraform/**'
      - 'infra/**'
      - 'policies/**'
      - '*.json'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security-gate:
    name: Agent Identity Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .

      - name: Scan IAM Policies
        id: scan
        run: |
          echo '## 🛡️ Agent Identity Guard Security Report' > report.md
          echo '' >> report.md
          echo '### Policy Scan Results' >> report.md
          echo '' >> report.md
          
          FINDINGS=0
          CRITICAL=0
          HIGH=0
          
          for f in $(find . -name '*.json' -path '*/iam/*' -o -name '*.json' -path '*/policies/*'); do
            echo "Scanning $f..."
            OUTPUT=$(python -m aws_agent_identity_guard "$f" --format json 2>/dev/null || true)
            if [ -n "$OUTPUT" ]; then
              COUNT=$(echo "$OUTPUT" | python -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('findings',[])))" 2>/dev/null || echo 0)
              FINDINGS=$((FINDINGS + COUNT))
              CRITS=$(echo "$OUTPUT" | python -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for f in d.get('findings',[]) if f.get('severity')=='critical'))" 2>/dev/null || echo 0)
              CRITICAL=$((CRITICAL + CRITS))
              HIGHS=$(echo "$OUTPUT" | python -c "import sys,json; d=json.load(sys.stdin); print(sum(1 for f in d.get('findings',[]) if f.get('severity')=='high'))" 2>/dev/null || echo 0)
              HIGH=$((HIGH + HIGHS))
            fi
          done
          
          echo "| Metric | Value |" >> report.md
          echo "|--------|-------|" >> report.md
          echo "| Total Findings | $FINDINGS |" >> report.md
          echo "| Critical | $CRITICAL |" >> report.md
          echo "| High | $HIGH |" >> report.md
          echo '' >> report.md
          
          if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
            echo '### ❌ Decision: **BLOCK**' >> report.md
            echo '' >> report.md
            echo 'Critical or high-severity findings detected. This PR cannot be merged until remediated.' >> report.md
            echo "gate_decision=BLOCK" >> $GITHUB_OUTPUT
          elif [ $FINDINGS -gt 0 ]; then
            echo '### ⚠️ Decision: **WARN**' >> report.md
            echo '' >> report.md
            echo 'Medium/low findings detected. Review recommended before merging.' >> report.md
            echo "gate_decision=WARN" >> $GITHUB_OUTPUT
          else
            echo '### ✅ Decision: **PASS**' >> report.md
            echo '' >> report.md
            echo 'No security findings. Safe to merge.' >> report.md
            echo "gate_decision=PASS" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: report.md

      - name: Fail on BLOCK
        if: steps.scan.outputs.gate_decision == 'BLOCK'
        run: exit 1
