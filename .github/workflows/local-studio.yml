name: Local IAM studio acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_DIR: /tmp/iam-studio-${{ github.run_id }}-${{ github.run_attempt }}
      SARIF_SCHEMA_PATH: /tmp/iam-sarif-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned verification environment and product
        run: |
          python -m pip install -r requirements-studio-test.txt
          python -m pip install -e .
          python -m playwright install --with-deps chromium
      - name: Retrieve and verify the fixed official SARIF schema
        run: |
          curl -fLS 'https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json' -o "$SARIF_SCHEMA_PATH"
          echo "c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e  $SARIF_SCHEMA_PATH" | sha256sum -c -
      - name: Run real engine, browser, schema, security and build checks
        run: |
          chromium_path=$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python scripts/studio_verify.py --output "$EVIDENCE_DIR" --schema "$SARIF_SCHEMA_PATH" --chromium "$chromium_path"
      - name: Upload generated exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iam-studio-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
