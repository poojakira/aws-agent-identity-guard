name: AWS Access Analyzer Differential Pilot

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate-policy:
    runs-on: ubuntu-latest
    environment: external-validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e ".[live]"
      - name: Require configured validation role
        env:
          ROLE_ARN: ${{ secrets.AWS_VALIDATION_ROLE_ARN }}
        run: |
          test -n "$ROLE_ARN" || { echo "AWS_VALIDATION_ROLE_ARN is not configured"; exit 2; }
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          role-to-assume: ${{ secrets.AWS_VALIDATION_ROLE_ARN }}
          aws-region: us-east-1
      - name: Compare against AWS IAM Access Analyzer
        run: |
          python validation/aws_access_analyzer_pilot.py             validation/policies/agent-overprivileged.json             validation/policies/agent-scoped.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: access-analyzer-differential-report
          path: validation/access-analyzer-report.json
