name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimal permissions — no token write access unless explicitly required per job.
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.8.4"
  BANDIT_VERSION: "1.8.3"
  PIP_AUDIT_VERSION: "2.10.1"
  CYCLONEDX_VERSION: "5.1.1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to commit SHA — actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Pinned to commit SHA — actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==${{ env.RUFF_VERSION }}
      - run: ruff check src tests --output-format=github
      - run: ruff format --check src tests

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      # Pinned to commit SHA — actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Pinned to commit SHA — actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit==${{ env.BANDIT_VERSION }} pip-audit==${{ env.PIP_AUDIT_VERSION }}
          pip install -e ".[dev]"
      - name: Bandit SAST scan (medium+ severity)
        run: bandit -r src/ -ll
      - run: pip-audit --skip-editable
      - run: |
          pip install cyclonedx-bom==${{ env.CYCLONEDX_VERSION }}
          cyclonedx-py environment --output-format JSON --outfile sbom.json
      # Pinned to commit SHA — actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Pinned to commit SHA — actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Pinned to commit SHA — actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite with machine-readable evidence
        run: pytest tests -q --junitxml=pytest-results.xml
      - name: Verify documented pass/skip counts
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          passed = tests - failures - errors - skipped

          print(f"PYTEST_EVIDENCE tests={tests} passed={passed} skipped={skipped} failures={failures} errors={errors}")
          if failures or errors:
              raise SystemExit("Test suite contains failures/errors")
          if tests < 200:
              raise SystemExit(
                  f"Unexpected test-suite contraction: collected {tests}, expected at least 200"
              )
          print(
              "NOTE: public test-count claims belong in generated evidence tied to this commit; "
              "CI does not freeze an exact historical count."
          )
          PY
      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          retention-days: 90

  performance:
    name: Performance gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      # Pinned to commit SHA — actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Pinned to commit SHA — actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Enforce scanner performance thresholds
        run: python benchmarks/perf_gate.py --policies 500 --output perf-results.json
      # Pinned to commit SHA — actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: performance-results
          path: perf-results.json
          retention-days: 90