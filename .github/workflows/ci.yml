name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.8.4
      - run: ruff check src/ tests/ --output-format=github
      - run: ruff format --check src/ tests/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install bandit==1.8.3 pip-audit==2.10.1 safety
          pip install -e '.[dev]'
      - run: bandit -r src/ -ll --format json --output bandit-results.json || true
      - run: pip-audit --skip-editable
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom==5.1.1
          cyclonedx-py environment --output-format JSON --outfile sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: |
            bandit-results.json
            sbom.json

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          pip install -e '.[dev]'
      - run: pytest tests/ -q --cov=aws_agent_identity_guard --cov-report=term-missing --cov-report=xml --cov-fail-under=35
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest tests/benchmarks/ -v --benchmark-json=benchmark.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json
