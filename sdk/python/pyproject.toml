[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-identity-guard"
version = "0.1.0"
description = "Python SDK for Agent Identity Guard — AI agent authorization and governance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Agent Identity Guard Team" },
]
keywords = ["ai", "agent", "authorization", "security", "governance", "aws"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.25.0,<1.0.0",
]

[project.optional-dependencies]
boto3 = [
    "boto3>=1.28.0,<2.0.0",
]
all = [
    "boto3>=1.28.0,<2.0.0",
]
dev = [
    "boto3>=1.28.0,<2.0.0",
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-httpx>=0.30.0,<1.0.0",
    "respx>=0.21.0,<1.0.0",
    "mypy>=1.5.0,<2.0.0",
    "ruff>=0.1.0,<1.0.0",
    "coverage>=7.0.0,<8.0.0",
]

[project.urls]
Homepage = "https://github.com/aws/agent-identity-guard"
Documentation = "https://github.com/aws/agent-identity-guard/tree/main/sdk/python"
Repository = "https://github.com/aws/agent-identity-guard"
Issues = "https://github.com/aws/agent-identity-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_identity_guard"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "TCH", "ARG"]
ignore = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["agent_identity_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["agent_identity_guard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
