[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-agent-identity-guard"
version = "0.3.0"
description = "IAM policy review: 24 static rules and one additional live-context boundary-presence rule."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Pooja Kiran"}]
keywords = ["aws", "iam", "agentic-ai", "bedrock", "sagemaker", "security", "least-privilege", "policy-linter", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
live = ["boto3>=1.34.0"]
# Keep the existing declared Ruff pin aligned with CI and the studio test tools.
dev = ["pytest>=8.2", "ruff==0.17.1", "pyright>=1.1.380", "moto[iam]>=5.0.0", "boto3>=1.34.0", "hypothesis>=6.100"]

[project.scripts]
aws-agent-identity-guard = "aws_agent_identity_guard.cli:main"
iam-studio = "aws_agent_identity_guard.studio.__main__:main"

[project.urls]
Homepage = "https://github.com/poojakira/aws-agent-identity-guard"
Issues = "https://github.com/poojakira/aws-agent-identity-guard/issues"
Documentation = "https://github.com/poojakira/aws-agent-identity-guard#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aws_agent_identity_guard.studio" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.ruff.lint.per-file-ignores]
# Poster HTML/SVG template literals retain intentional long lines.
"poster/render_poster.py" = ["E501"]
