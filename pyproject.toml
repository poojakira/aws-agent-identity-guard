[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-agent-identity-guard"
version = "0.1.0"
description = "Static IAM and trust-policy guardrails for agentic AI workloads on AWS."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pooja Kiran"}]
keywords = ["aws", "iam", "agentic-ai", "bedrock", "security", "least-privilege"]
dependencies = []

[project.optional-dependencies]
# Live scanning requires boto3 and an AWS account with IAM read permissions
live = ["boto3>=1.34.0"]
dev = ["pytest>=8.2", "ruff>=0.8", "moto[iam]>=5.0.0", "boto3>=1.34.0"]

[project.scripts]
aws-agent-identity-guard = "aws_agent_identity_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
