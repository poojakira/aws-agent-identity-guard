[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-agent-identity-guard"
version = "1.0.0"
description = "Production-grade AI agent identity security platform for AWS. Runtime authorization, attack-path analysis, privilege-escalation detection, and policy enforcement for Bedrock, Lambda, SageMaker, and ECS agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pooja Kiran", email = "poojakiran@proton.me"}]
keywords = ["aws", "iam", "agentic-ai", "bedrock", "sagemaker", "security", "least-privilege", "policy-linter", "sarif", "authorization", "zero-trust", "runtime-security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
live = ["boto3>=1.34.0"]
server = ["uvicorn>=0.27.0", "redis>=5.0.0"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "pytest-asyncio>=0.23", "ruff>=0.8", "pyright>=1.1.380", "moto[iam]>=5.0.0", "boto3>=1.34.0", "httpx>=0.27.0"]
all = ["boto3>=1.34.0", "uvicorn>=0.27.0", "redis>=5.0.0", "httpx>=0.27.0"]

[project.scripts]
aws-agent-identity-guard = "aws_agent_identity_guard.cli:main"
agent-guard-server = "aws_agent_identity_guard.api:main"

[project.urls]
Homepage = "https://github.com/poojakira/aws-agent-identity-guard"
Documentation = "https://github.com/poojakira/aws-agent-identity-guard/tree/main/docs"
Issues = "https://github.com/poojakira/aws-agent-identity-guard/issues"
Changelog = "https://github.com/poojakira/aws-agent-identity-guard/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
